name: Update data

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      forest:
        description: "Rebuild forest loss (large download, needed once a year)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore earlier downloads
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: downloads-${{ github.run_id }}
          restore-keys: |
            downloads-
            chirps-
      - name: Build layers
        id: build
        continue-on-error: true
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          FOREST: ${{ inputs.forest }}
        run: python scripts/update.py
      - name: Keep downloads for next time
        uses: actions/cache/save@v4
        with:
          path: cache
          key: downloads-${{ github.run_id }}
      - name: Publish what changed
        run: |
          git config user.name "tinga-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git push)
      - name: Report failures
        if: steps.build.outcome == 'failure'
        run: |
          echo "At least one layer failed. Open the 'Build layers' step to see which."
          exit 1
