name: Update data

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      forest:
        description: "Rebuild forest loss (large download, needed once a year)"
        type: boolean
        default: false
      biodiversity:
        description: "Rebuild biodiversity now (otherwise once a month)"
        type: boolean
        default: false
      ee_check:
        description: "Only test the Google Earth Engine key (updates nothing)"
        type: boolean
        default: false
      floodprone:
        description: "Rebuild flood-prone land (Google Earth Engine, needed about once a year)"
        type: boolean
        default: false

      agriculture:
        description: "Cropland and soil nutrients (Google Earth Engine): trial = 8 districts, nothing published; full = all districts"
        type: choice
        options: ["no", "trial", "full"]
        default: "no"

      soilgrid:
        description: "Soil values across Ghana on a 1 km grid (Google Earth Engine): trial = pH only, published; full = all soil properties. Run the trial first"
        type: choice
        options: ["no", "trial", "full"]
        default: "no"

      crops:
        description: "Which crops are grown where (SPAM 2020 file kept in the repository, no download, no Earth Engine): trial = prints totals, publishes nothing; full = rebuild. Already published, so leave on no"
        type: choice
        options: ["no", "trial", "full"]
        default: "no"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore earlier downloads
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: downloads-${{ github.run_id }}
          restore-keys: |
            downloads-
            chirps-
      - name: Build layers
        id: build
        continue-on-error: true
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          FOREST: ${{ inputs.forest }}
          BIODIVERSITY: ${{ inputs.biodiversity }}
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_CHECK: ${{ inputs.ee_check }}
          FLOODPRONE: ${{ inputs.floodprone }}
          AGRICULTURE: ${{ inputs.agriculture }}
          CROPS: ${{ inputs.crops }}
          SOILGRID: ${{ inputs.soilgrid }}
        run: python scripts/update.py
      - name: Keep downloads for next time
        uses: actions/cache/save@v4
        with:
          path: cache
          key: downloads-${{ github.run_id }}
      - name: Publish what changed
        run: |
          git config user.name "tinga-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git push)
      - name: Report failures
        if: steps.build.outcome == 'failure'
        run: |
          echo "At least one layer failed. Open the 'Build layers' step to see which."
          exit 1
