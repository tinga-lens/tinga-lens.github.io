name: Update drought data

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC; new CHIRPS months appear about once a month
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore downloaded rainfall
        uses: actions/cache@v4
        with:
          path: cache
          key: chirps-${{ github.run_id }}
          restore-keys: chirps-
      - name: Build drought layer
        run: python scripts/drought.py
      - name: Publish if changed
        run: |
          git config user.name "tinga-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/drought.json
          git diff --cached --quiet || (git commit -m "Update drought data" && git push)
